name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build (Rust + frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      # The desktop crate embeds dist/ at compile time (generate_context!),
      # so the frontend must be built before the Rust workspace.
      - name: Build the frontend
        run: |
          npm install
          npm run build

      - name: Build the workspace (desktop app + CLI)
        run: cargo build --workspace

      - name: Test
        run: cargo test -p memorywhale-core -p memorywhale-cli
