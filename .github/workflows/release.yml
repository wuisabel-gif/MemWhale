name: Release

# Tag a reviewed version to publish; a manual branch run is build-only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify product and tag versions
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            scripts/check-release-version.sh "$GITHUB_REF_NAME"
          else
            scripts/check-release-version.sh
          fi
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          test -s "docs/releases/$version.md"
      - name: Verify crates together in dependency order
        run: cargo publish --dry-run --locked -p memorywhale-core -p memorywhale-cli
      - name: Prepare draft release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = true || {
              echo "Refusing to replace an already published release." >&2
              exit 1
            }
            echo "Release already exists; retrying missing build/publish steps."
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft \
              --title "MemoryWhale $VERSION — Agent-Native Memory" \
              --notes-file "docs/releases/$VERSION.md"
          fi

  binaries:
    name: ${{ matrix.target }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux uses 22.04 (glibc 2.35) for broad compatibility, incl. JetPack 6 Jetsons.
          # ponytail: if older JetPack/glibc matters, switch these two to musl targets.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            deb: true
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            deb: true
          # Native runners execute the extracted binaries, not just cross-build
          # archives whose entry points have never been smoke-tested.
          - os: macos-15-intel
            target: x86_64-apple-darwin
            deb: false
          - os: macos-15
            target: aarch64-apple-darwin
            deb: false
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build CLI (no Tauri/GTK)
        run: cargo build --locked --release -p memorywhale-cli --bins --target ${{ matrix.target }}

      - name: Package tarball
        id: package
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          ver="$VERSION"
          name="memorywhale-${ver}-${{ matrix.target }}"
          staging="$name"
          mkdir -p "$staging/bin"
          for b in mw mw-remember mw-serve mw-view mw-recover mw-run mw-screenshot mw-mcp; do
            cp "target/${{ matrix.target }}/release/$b" "$staging/bin/"
          done
          cp README.md LICENSE "$staging/"
          cp -r linux/completions linux/man "$staging/"
          tar czf "$name.tar.gz" "$staging"
          echo "asset=$name.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Smoke-test packaged artifact
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          asset="${{ steps.package.outputs.asset }}"
          ver="$VERSION"
          root="memorywhale-${ver}-${{ matrix.target }}"
          # Read the tarball listing once. Piping `tar tzf` into head/grep -q
          # closes the pipe early, which SIGPIPEs GNU tar (Linux) and fails the
          # step under `pipefail`; here-strings avoid that.
          listing="$(tar tzf "$asset")"
          test "$(head -1 <<< "$listing")" = "$root/"
          for b in mw mw-remember mw-serve mw-view mw-recover mw-run mw-screenshot mw-mcp; do
            grep -qx "$root/bin/$b" <<< "$listing"
          done
          grep -qx "$root/README.md" <<< "$listing"
          grep -qx "$root/LICENSE" <<< "$listing"
          mkdir -p "$RUNNER_TEMP/unpacked"
          tar xzf "$asset" -C "$RUNNER_TEMP/unpacked"
          python3 scripts/smoke-release.py "$RUNNER_TEMP/unpacked/$root/bin" "$VERSION"

      - name: Checksum tarball
        shell: bash
        run: |
          asset="${{ steps.package.outputs.asset }}"
          shasum -a 256 "$asset" > "$asset.sha256"
          cat "$asset.sha256"

      - name: Build .deb
        if: matrix.deb
        run: |
          cargo install cargo-deb --locked
          cargo deb -p memorywhale-cli --target ${{ matrix.target }} --no-build --output "memorywhale_${{ matrix.target }}.deb"
          dpkg-deb --info "memorywhale_${{ matrix.target }}.deb"
          mkdir -p "$RUNNER_TEMP/deb-unpacked"
          dpkg-deb --extract "memorywhale_${{ matrix.target }}.deb" "$RUNNER_TEMP/deb-unpacked"
          python3 scripts/smoke-release.py "$RUNNER_TEMP/deb-unpacked/usr/bin" "${{ needs.preflight.outputs.version }}"
          shasum -a 256 "memorywhale_${{ matrix.target }}.deb" > "memorywhale_${{ matrix.target }}.deb.sha256"

      - name: Retain verified artifacts for build-only runs
        uses: actions/upload-artifact@v4
        with:
          name: memorywhale-${{ matrix.target }}
          overwrite: true
          path: |
            ${{ steps.package.outputs.asset }}
            ${{ steps.package.outputs.asset }}.sha256
            *.deb
            *.deb.sha256

      - name: Upload to release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            ${{ steps.package.outputs.asset }}
            ${{ steps.package.outputs.asset }}.sha256
            *.deb
            *.deb.sha256

  # Keep the GitHub release in draft until all four platform archives and the
  # registry install have been verified. Publish one curated note body.
  release-notes:
    name: Publish verified release
    needs: [preflight, binaries, publish-crate]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Publish release after all artifacts and crates pass
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest \
            --title "MemoryWhale $VERSION — Agent-Native Memory" \
            --notes-file "docs/releases/$VERSION.md"

  # Update Formula/memorywhale.rb on main to point at the new tag, so
  # `brew install` never lags a release. Last manual release chore, automated.
  bump-formula:
    name: Bump Homebrew formula
    needs: release-notes
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    # Never let a formula-bump hiccup fail the release; the binaries and crate
    # matter more, and the bump lands via PR below.
    continue-on-error: true
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Open a formula-bump PR for ${{ github.ref_name }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz"
          archive="$RUNNER_TEMP/memorywhale-source.tar.gz"
          curl --fail --location --retry 3 "$url" --output "$archive"
          sha=$(shasum -a 256 "$archive" | cut -d' ' -f1)
          sed -i -E "s|^(  url )\".*\"|\1\"$url\"|; s|^(  sha256 )\".*\"|\1\"$sha\"|" Formula/memorywhale.rb
          if git diff --quiet; then
            echo "formula already points at ${GITHUB_REF_NAME} — nothing to do."
            exit 0
          fi
          # main is protected, so open a PR instead of pushing to it directly.
          branch="homebrew-bump-${GITHUB_REF_NAME}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -am "Set Homebrew formula to ${GITHUB_REF_NAME}"
          git push -f origin "$branch"
          if pr_url=$(gh pr create --base main --head "$branch" \
            --title "Set Homebrew formula to ${GITHUB_REF_NAME}" \
            --body "Automated Homebrew formula bump for ${GITHUB_REF_NAME}." 2>&1); then
            echo "$pr_url"
          else
            echo "$pr_url" >&2
            existing_pr=""
            if ! existing_pr=$(gh pr list --base main --head "$branch" --state open --json url --jq '.[0].url // empty'); then
              echo "::warning::Could not check for an existing Homebrew formula PR; inspect the gh error above."
            fi
            if [ -n "$existing_pr" ]; then
              echo "Formula PR already exists: $existing_pr"
            else
              echo "::warning::Automated pull-request creation failed; inspect the gh error above."
              echo "Formula branch pushed successfully: https://github.com/${GITHUB_REPOSITORY}/tree/${branch}"
              echo "Open a PR manually from ${branch} to main."
            fi
          fi

  # Publish core before CLI. Already-published versions support safe retries;
  # a missing credential or a failed registry install blocks final publication.
  publish-crate:
    name: Publish to crates.io
    needs: [preflight, binaries]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          # pipefail so `cargo publish … | tee` reflects cargo's exit code, not
          # tee's — without it a failed publish silently reports success.
          set -o pipefail
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "CARGO_REGISTRY_TOKEN is required to publish this release." >&2
            exit 1
          fi
          publish() {
            # Success, or "already on crates.io" (idempotent re-runs), else fail.
            if cargo publish --locked -p "$1" 2>&1 | tee publish.log; then
              echo "published $1"
            elif grep -qi "already exists\|already uploaded" publish.log; then
              echo "$1 is already on crates.io — nothing to do."
            else
              return 1
            fi
          }
          # memorywhale-core must land first: memorywhale-cli depends on it by version.
          publish memorywhale-core || exit 1
          # crates.io needs a moment to index the new version before the CLI can
          # resolve it; retry the CLI a few times to ride out that lag.
          for attempt in 1 2 3 4 5; do
            if publish memorywhale-cli; then break; fi
            if [ "$attempt" = 5 ]; then exit 1; fi
            echo "retrying memorywhale-cli in 20s (crates.io indexing lag)…"
            sleep 20
          done
          version="$(node -p "require('./package.json').version")"
          for attempt in 1 2 3 4 5; do
            if cargo install --locked memorywhale-cli --version "=$version" --root "$RUNNER_TEMP/registry-install"; then break; fi
            if [ "$attempt" = 5 ]; then exit 1; fi
            echo "retrying registry install in 20s (index propagation)…"
            sleep 20
          done
          python3 scripts/smoke-release.py "$RUNNER_TEMP/registry-install/bin" "$version"
