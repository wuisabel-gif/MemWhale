name: Release

# Tag a version to cut a release:  git tag v0.2.1 && git push --tags
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify product and tag versions
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            scripts/check-release-version.sh "$GITHUB_REF_NAME"
          else
            scripts/check-release-version.sh
          fi

  binaries:
    name: ${{ matrix.target }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux uses 22.04 (glibc 2.35) for broad compatibility, incl. JetPack 6 Jetsons.
          # ponytail: if older JetPack/glibc matters, switch these two to musl targets.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            deb: true
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            deb: true
          # Both Mac targets build on the arm runner: it cross-compiles to
          # x86_64-apple-darwin fine (Apple's toolchain links either natively),
          # and macos-13 (Intel) runners are scarce/deprecated on GitHub —
          # that job sat queued for 24h and got cancelled on the v0.3.0 release.
          - os: macos-latest
            target: x86_64-apple-darwin
            deb: false
          - os: macos-latest
            target: aarch64-apple-darwin
            deb: false
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build CLI (no Tauri/GTK)
        run: cargo build --release -p memorywhale-cli --target ${{ matrix.target }}

      - name: Package tarball
        id: package
        shell: bash
        run: |
          ver="${GITHUB_REF_NAME#v}"
          name="memorywhale-${ver}-${{ matrix.target }}"
          staging="$name"
          mkdir -p "$staging/bin"
          for b in mw mw-remember mw-serve mw-view mw-recover mw-run mw-screenshot mw-mcp; do
            cp "target/${{ matrix.target }}/release/$b" "$staging/bin/"
          done
          cp README.md LICENSE "$staging/"
          cp -r linux/completions linux/man "$staging/" 2>/dev/null || true
          tar czf "$name.tar.gz" "$staging"
          echo "asset=$name.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Smoke-test packaged artifact
        shell: bash
        run: |
          asset="${{ steps.package.outputs.asset }}"
          ver="${GITHUB_REF_NAME#v}"
          root="memorywhale-${ver}-${{ matrix.target }}"
          # Read the tarball listing once. Piping `tar tzf` into head/grep -q
          # closes the pipe early, which SIGPIPEs GNU tar (Linux) and fails the
          # step under `pipefail`; here-strings avoid that.
          listing="$(tar tzf "$asset")"
          test "$(head -1 <<< "$listing")" = "$root/"
          for b in mw mw-remember mw-serve mw-view mw-recover mw-run mw-screenshot mw-mcp; do
            grep -qx "$root/bin/$b" <<< "$listing"
          done
          grep -qx "$root/README.md" <<< "$listing"
          grep -qx "$root/LICENSE" <<< "$listing"

      - name: Checksum tarball
        shell: bash
        run: |
          asset="${{ steps.package.outputs.asset }}"
          shasum -a 256 "$asset" > "$asset.sha256"
          cat "$asset.sha256"

      - name: Build .deb
        if: matrix.deb
        run: |
          cargo install cargo-deb --locked
          cargo deb -p memorywhale-cli --target ${{ matrix.target }} --no-build --output "memorywhale_${{ matrix.target }}.deb"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          # Auto-generate "What's Changed" notes from commits since the last
          # release, so a tagged release is never published with an empty body.
          # (Edit the release afterward for curated highlights.)
          generate_release_notes: true
          files: |
            ${{ steps.package.outputs.asset }}
            ${{ steps.package.outputs.asset }}.sha256
            *.deb

  # Update Formula/memorywhale.rb on main to point at the new tag, so
  # `brew install` never lags a release. Last manual release chore, automated.
  bump-formula:
    name: Bump Homebrew formula
    needs: preflight
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    # Never let a formula-bump hiccup fail the release; the binaries and crate
    # matter more, and the bump lands via PR below.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Open a formula-bump PR for ${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz"
          sha=$(curl -fsSL "$url" | shasum -a 256 | cut -d' ' -f1)
          sed -i -E "s|^(  url )\".*\"|\1\"$url\"|; s|^(  sha256 )\".*\"|\1\"$sha\"|" Formula/memorywhale.rb
          if git diff --quiet; then
            echo "formula already points at ${GITHUB_REF_NAME} — nothing to do."
            exit 0
          fi
          # main is protected, so open a PR instead of pushing to it directly.
          branch="homebrew-bump-${GITHUB_REF_NAME}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -am "Set Homebrew formula to ${GITHUB_REF_NAME}"
          git push -f origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Set Homebrew formula to ${GITHUB_REF_NAME}" \
            --body "Automated Homebrew formula bump for ${GITHUB_REF_NAME}." \
            || gh pr edit "$branch" --title "Set Homebrew formula to ${GITHUB_REF_NAME}"

  # Publish the CLI crate to crates.io once per release. Runs once (not in the
  # matrix above). Skips gracefully if the token secret isn't set or the version
  # is already published, so it never turns a release red for those reasons.
  publish-crate:
    name: Publish to crates.io
    needs: preflight
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          # pipefail so `cargo publish … | tee` reflects cargo's exit code, not
          # tee's — without it a failed publish silently reports success.
          set -o pipefail
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "CARGO_REGISTRY_TOKEN not set — skipping crates.io publish."
            echo "Add the secret to enable automatic publishing:"
            echo "  gh secret set CARGO_REGISTRY_TOKEN"
            exit 0
          fi
          publish() {
            # Success, or "already on crates.io" (idempotent re-runs), else fail.
            if cargo publish -p "$1" 2>&1 | tee publish.log; then
              echo "published $1"
            elif grep -qi "already exists\|already uploaded" publish.log; then
              echo "$1 is already on crates.io — nothing to do."
            else
              return 1
            fi
          }
          # memorywhale-core must land first: memorywhale-cli depends on it by version.
          publish memorywhale-core || exit 1
          # crates.io needs a moment to index the new version before the CLI can
          # resolve it; retry the CLI a few times to ride out that lag.
          for attempt in 1 2 3 4 5; do
            if publish memorywhale-cli; then exit 0; fi
            echo "retrying memorywhale-cli in 20s (crates.io indexing lag)…"
            sleep 20
          done
          exit 1
