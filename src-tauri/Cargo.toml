[package]
name = "memorywhale"
version = "0.4.0"
description = "A Rust/Tauri visual second brain for local knowledge graphs"
authors = ["MemoryWhale"]
license = "MIT"
edition = "2021"
default-run = "memorywhale"

[lib]
name = "memorywhale_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.1", features = [] }

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
memorywhale-cli = { path = "../crates/mw-cli" }
mw-memory = { path = "../crates/mw-memory" }
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.1", features = [] }
tauri-plugin-dialog = "2.0"
tauri-plugin-fs = "2.0"
tauri-plugin-opener = "2.0"
thiserror = "1"

# The CLI binaries (mw, mw-serve, …) and their Debian packaging now live in
# crates/mw-cli so they build without Tauri/GTK. This package is the desktop app only.
