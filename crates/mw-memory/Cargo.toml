[package]
name = "mw-memory"
version = "0.1.0"
edition = "2021"
description = "Explainable retrieval for MemoryWhale: a MemoryEngine interface, a built-in scorer that ranks memories with per-signal reasons, and a pluggable MemPalace backend."
license = "MIT"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
# The one SQLite loader (mw_memory::sqlite) lives here so the CLI and desktop
# share it. bundled = no system libsqlite3 needed (matches the other crates).
rusqlite = { version = "0.32", features = ["bundled"] }

# `dirs` is used only by the `dump_eval` example, which reads a real
# memorywhale.sqlite3 into an eval_data.json gold-set skeleton.
[dev-dependencies]
dirs = "5"
