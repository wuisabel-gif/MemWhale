[package]
name = "memorywhale-cli"
version = "0.7.0"
description = "MemoryWhale CLI — local-first terminal memory. Record commands, sessions, and output into local SQLite; browse them in a built-in web dashboard. Nothing is uploaded."
authors = ["Isabel Wu <wuisabel@usc.edu>"]
license = "MIT"
edition = "2021"
repository = "https://github.com/wuisabel-gif/MemWhale"
readme = "README.md"
keywords = ["terminal", "memory", "cli", "mcp", "sqlite"]
categories = ["command-line-utilities", "development-tools"]

# No Tauri, no GTK/WebKit: this is what lets `cargo install memorywhale-cli` and
# the aarch64 (Jetson) release builds work on a bare machine.
[dependencies]
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
# The `mempalace` feature adds no dependencies (std process + serde_json +
# anyhow, all already present), so it's enabled unconditionally: it lets
# `engine = "mempalace"` in config.toml route search through a local MemPalace
# MCP server, with a builtin fallback when that server is unreachable.
# `version` (alongside `path`) is required so `cargo publish` can resolve the
# dependency from crates.io — publish memorywhale-core first, then this crate.
memorywhale-core = { path = "../memorywhale-core", version = "0.3.0", features = ["mempalace"] }
regex = "1"
# Pure-Rust interactive terminal UI (`mw tui`) — no system libraries, so it
# keeps the bare-machine / Jetson build story intact. Bundles crossterm.
ratatui = "0.29"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Parent-death detection (prctl on Linux, getppid/pipe-EOF elsewhere).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Integration test spawns a real process tree (fork) and inspects the DB row.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }

# `cargo install cargo-deb && cargo deb -p mw-cli` builds the Debian/Jetson package.
# ponytail: asset paths are manifest-relative; verified only in CI (no dpkg locally).
[package.metadata.deb]
name = "memorywhale"
maintainer = "Isabel Wu <wuisabel@usc.edu>"
copyright = "2026, MemoryWhale"
license-file = ["../../LICENSE", "0"]
extended-description = """
Local-first terminal memory. Record commands, whole sessions, and output into a \
local SQLite database and browse them in a built-in web dashboard. Nothing is \
ever uploaded."""
section = "utils"
priority = "optional"
depends = "$auto"
assets = [
    ["target/release/mw", "usr/bin/", "755"],
    ["target/release/mw-remember", "usr/bin/", "755"],
    ["target/release/mw-serve", "usr/bin/", "755"],
    ["target/release/mw-view", "usr/bin/", "755"],
    ["target/release/mw-recover", "usr/bin/", "755"],
    ["target/release/mw-run", "usr/bin/", "755"],
    ["target/release/mw-screenshot", "usr/bin/", "755"],
    ["target/release/mw-mcp", "usr/bin/", "755"],
    ["../../linux/man/mw.1", "usr/share/man/man1/", "644"],
    ["../../linux/man/mw-serve.1", "usr/share/man/man1/", "644"],
    ["../../linux/man/mw-remember.1", "usr/share/man/man1/", "644"],
    ["../../linux/man/mw-run.1", "usr/share/man/man1/", "644"],
    ["../../linux/man/mw-mcp.1", "usr/share/man/man1/", "644"],
    ["../../linux/man/mw-view.1", "usr/share/man/man1/", "644"],
    ["../../linux/man/mw-recover.1", "usr/share/man/man1/", "644"],
    ["../../linux/completions/mw.bash", "usr/share/bash-completion/completions/mw", "644"],
    ["../../linux/completions/mw-extra.bash", "usr/share/bash-completion/completions/mw-run", "644"],
    ["../../linux/completions/mw-extra.bash", "usr/share/bash-completion/completions/mw-remember", "644"],
    ["../../linux/completions/mw-extra.bash", "usr/share/bash-completion/completions/mw-serve", "644"],
    ["../../linux/completions/mw-extra.bash", "usr/share/bash-completion/completions/mw-view", "644"],
    ["../../linux/completions/_mw", "usr/share/zsh/vendor-completions/_mw", "644"],
    ["../../linux/completions/_mw-extra", "usr/share/zsh/vendor-completions/_mw-extra", "644"],
    ["shell/memorywhale.sh", "usr/share/memorywhale/", "644"],
    ["../../linux/systemd/memorywhale-dashboard.service", "usr/share/memorywhale/", "644"],
    ["../../linux/systemd/enable-dashboard.sh", "usr/share/memorywhale/", "755"],
    ["../../linux/README.md", "usr/share/doc/memorywhale/LINUX.md", "644"],
]
