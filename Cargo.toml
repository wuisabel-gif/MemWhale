[workspace]
resolver = "2"
members = ["src-tauri", "crates/memorywhale-core", "crates/mw-cli"]

# The desktop app (src-tauri) pulls in Tauri/GTK/WebKit; the CLI (crates/mw-cli)
# is deliberately kept dependency-light so `cargo install` and Jetson (aarch64)
# release builds never need those system libraries.
